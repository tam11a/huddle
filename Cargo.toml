[package]
name = "huddle"
version = "0.2.0"
edition = "2024"
description = "A personal scrum board and stand-up assistant for Claude Code"
license = "MIT"
repository = "https://github.com/tam11a/huddle"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
